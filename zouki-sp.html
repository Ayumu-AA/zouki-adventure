<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12131a">
<title>臓器アドベンチャー</title>
<style>
:root{
  --bg:#12131a; --panel:#1c1e29; --panel2:#242737; --line:#343850;
  --tx:#e8eaf2; --tx2:#9aa0b8;
  --gut:#e2a03f; --blood:#e0556a; --waste:#7d63c9; --energy:#3fc4a0; --vp:#f2d13c;
  --ok:#4ade80; --ng:#f87171;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior:none}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:14px; line-height:1.5; user-select:none; -webkit-user-select:none;
}
button{font-family:inherit; cursor:pointer; border:none; color:inherit; background:none}

#app{height:100dvh; max-width:480px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; position:relative}

/* ===== 上部バー ===== */
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:8px 10px;
  background:linear-gradient(90deg,#2a1f3d,#1c1e29); border-bottom:1px solid var(--line);
}
.tstat{background:#00000040; border:1px solid var(--line); border-radius:8px; padding:2px 8px; text-align:center; min-width:52px}
.tstat b{display:block; font-size:15px; line-height:1.25; font-variant-numeric:tabular-nums}
.tstat span{font-size:8.5px; color:var(--tx2); display:block; line-height:1.2}
.tstat .hpbar{height:4px; background:#00000060; border-radius:2px; overflow:hidden; margin-top:2px}
.tstat .hpbar i{display:block; height:100%; background:var(--ng); transition:width .3s}
#condchip{margin-left:auto; font-size:10px; color:var(--vp); background:#f2d13c14; border:1px solid #f2d13c44;
  border-radius:99px; padding:3px 7px; max-width:76px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tbtn{min-width:40px;min-height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:15px;font-weight:800;flex:0 0 auto}

/* ===== 体の図 ===== */
#bodyarea{flex:1 1 auto; position:relative; min-height:0; display:flex; justify-content:center}
#bodywrap{position:relative; height:100%; aspect-ratio:300/500; max-width:100%}
#bodysvg{position:absolute; inset:0; width:100%; height:100%}
#bodysvg .sil{fill:#ffffff07; stroke:#ffffff1c; stroke-width:1.5}
#bodysvg .vessel{fill:none; stroke:#e0556a3d; stroke-width:5; stroke-linecap:round; stroke-dasharray:5 9}
#bodywrap.flowing .vessel{animation:vflow .8s linear infinite}
@keyframes vflow{to{stroke-dashoffset:-14}}
.flowchip{position:absolute; top:2px; left:2px; z-index:4; background:#2b1a20ee; border:1px solid #e0556a66;
  border-radius:99px; padding:2px 10px; font-size:11px; color:#ffb8c4}
.flowchip b{font-size:14px; color:#fff}

.onode{position:absolute; transform:translate(-50%,-50%); width:52px; min-height:46px; padding:3px 1px 2px;
  background:#242737f0; border:1px solid var(--line); border-radius:10px; text-align:center;
  transition:transform .14s,border-color .14s; z-index:3}
.onode .oico{font-size:17px; display:block; line-height:1.15; pointer-events:none}
.onode .olab{font-size:8px; color:var(--tx2); display:block; white-space:nowrap; pointer-events:none}
.onode .ocnt{position:absolute; top:-6px; right:-6px; background:var(--energy); color:#06231c;
  font-size:9px; font-weight:700; border-radius:99px; padding:0 4px; pointer-events:none}
.onode.spent{opacity:.35; filter:grayscale(.85)}
.onode.ghost{opacity:.34; border-style:dashed; background:#1c1e29cc}
.onode.pulse{animation:opulse .5s}
@keyframes opulse{35%{transform:translate(-50%,-50%) scale(1.28); box-shadow:0 0 18px #3fc4a099; border-color:var(--energy)}}
.guide{outline:3px solid var(--vp) !important; outline-offset:3px; animation:gblink 1s infinite; z-index:6}
@keyframes gblink{50%{outline-color:#f2d13c22}}

/* 体の上のミニ数値パネル */
.miniz{position:absolute; z-index:2; background:#12131acc; border-radius:8px; padding:3px 6px;
  font-size:10px; line-height:1.55; pointer-events:none; backdrop-filter:blur(2px)}
.miniz .mrow{display:flex; justify-content:space-between; gap:6px; white-space:nowrap}
.miniz .mrow b{font-variant-numeric:tabular-nums}
.miniz .mrow.warn b{color:var(--ng)}
.miniz h4{font-size:8.5px; font-weight:700; letter-spacing:.06em; margin-bottom:1px}
.miniz.blood{left:1%; top:7.5%; max-width:27%; border-left:2px solid var(--blood)}
.miniz.blood h4{color:#ff9fae}
.miniz.gut{right:1%; top:1%; max-width:29%; border-left:2px solid var(--gut)}
.miniz.gut h4{color:#f2c27e}
.miniz.waste{right:1%; bottom:2%; max-width:28%; border-left:2px solid var(--waste)}
.miniz.waste h4{color:#b8a5ef}
.delta{font-size:9px; font-weight:700; margin-left:3px; display:inline-block; animation:drise 1.2s forwards}
.delta.up{color:var(--ok)} .delta.dn{color:var(--ng)}
@keyframes drise{0%{opacity:0; transform:translateY(4px)}18%{opacity:1}75%{opacity:1}100%{opacity:0; transform:translateY(-8px)}}

/* ===== 下部 ===== */
#guidebar{flex:0 0 auto; font-size:11.5px; padding:5px 12px; color:var(--vp); background:#26231433;
  border-top:1px solid #f2d13c33; text-align:center; min-height:28px}
#guidebar:empty{display:none}
#handrow{flex:0 0 auto; display:flex; gap:7px; overflow-x:auto; padding:8px 10px 4px; scrollbar-width:none}
#handrow::-webkit-scrollbar{display:none}
.hcard{flex:0 0 auto; width:96px; min-height:88px; background:linear-gradient(160deg,#2b2436,#1e1a27);
  border:1px solid #4a3d5c; border-radius:10px; padding:6px 7px; text-align:left; position:relative}
.hcard .ico{font-size:17px; line-height:1}
.hcard .nm{font-weight:700; font-size:11px; margin-top:2px}
.hcard .tx{font-size:8.5px; color:#c3c8de; line-height:1.35; margin-top:2px}
.hcard.pulse{animation:opulse .5s}
#actrow{flex:0 0 auto; display:flex; gap:7px; padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
.abtn{flex:1; min-height:46px; border-radius:11px; font-size:13px; font-weight:700;
  background:var(--panel2); border:1px solid var(--line)}
.abtn:active{transform:scale(.97)}
.abtn.grow{background:linear-gradient(135deg,#f2d13c,#d9a92c); color:#332600}
.abtn.grow.dim{filter:grayscale(.6); opacity:.55}
.abtn.end{background:linear-gradient(135deg,#3fc4a0,#2b9b7d); color:#06231c}

/* ===== ボトムシート（ショップ） ===== */
#sheet{position:absolute; left:0; right:0; bottom:0; top:14%; z-index:40;
  background:var(--panel); border-radius:18px 18px 0 0; border:1px solid var(--line);
  transform:translateY(110%); transition:transform .28s cubic-bezier(.2,.8,.3,1);
  display:flex; flex-direction:column; box-shadow:0 -12px 40px #000a}
#sheet.on{transform:translateY(0)}
#sheet header{flex:0 0 auto; display:flex; align-items:center; padding:10px 14px 6px; gap:10px}
#sheet header h2{font-size:13px}
#sheet header .en{margin-left:auto; font-size:12px; color:var(--energy); font-weight:700}
#sheet .close{min-width:44px; min-height:38px; background:var(--panel2); border-radius:9px; font-size:12px}
#shoplist{flex:1; overflow-y:auto; padding:4px 12px 20px}
.scard{width:100%; margin-bottom:7px; background:linear-gradient(160deg,var(--panel2),#1b1e2b);
  border:1px solid var(--line); border-radius:10px; padding:8px 9px; text-align:left; position:relative; min-height:52px}
.scard .cost{position:absolute; top:8px; right:9px; background:var(--energy); color:#06231c;
  font-size:11px; font-weight:700; border-radius:99px; padding:1px 8px}
.scard .nm{font-weight:700; font-size:12.5px}
.scard .cat{font-size:9px; color:var(--tx2)}
.scard .tx{font-size:9.5px; color:#c3c8de; margin-top:2px; line-height:1.4}
.scard.cant{opacity:.4}
.shophead{font-size:10px; letter-spacing:.08em; color:var(--tx2); margin:10px 0 6px; padding-bottom:3px; border-bottom:1px solid var(--line)}

/* ===== オーバーレイ ===== */
.ovl{position:absolute; inset:0; z-index:60; background:#000000d6; display:none;
  align-items:center; justify-content:center; padding:22px; backdrop-filter:blur(4px)}
.ovl.on{display:flex}
.ovl .box{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px;
  width:100%; max-width:360px; max-height:86%; overflow-y:auto; text-align:center}
.ovl .box h2{font-size:17px; margin-bottom:8px}
.ovl .box p{font-size:12.5px; color:#ccd1e6; margin-bottom:6px; text-align:left}
.ovl .box p.c{text-align:center}
.ovl .bigico{font-size:44px; line-height:1.2}
.ovl .dmgv{font-size:26px; font-weight:800; color:var(--ng)}
.ovl .btn{display:block; width:100%; min-height:48px; border-radius:12px; font-size:14px; font-weight:700;
  background:linear-gradient(135deg,#3fc4a0,#2b9b7d); color:#06231c; margin-top:10px}
.ovl .btn.sub{background:var(--panel2); color:var(--tx); border:1px solid var(--line)}
.ovl .btn.dis{opacity:.4; pointer-events:none}
.ovl .sci{background:#1a2b26; border-left:3px solid var(--energy); padding:7px 10px; border-radius:0 6px 6px 0;
  font-size:11px; margin:8px 0; text-align:left; color:#cfe8de}
.chainrow{background:#00000040; border:1px solid var(--line); border-radius:8px; padding:6px 9px; margin:5px 0;
  font-size:10.5px; text-align:left; line-height:1.5}
.chainrow b{color:var(--gut)}
.lvbtn{display:flex; align-items:center; gap:12px; width:100%; background:var(--panel2); border:1px solid var(--line);
  border-radius:13px; padding:12px 14px; margin-top:10px; text-align:left; min-height:60px}
.lvbtn .lvname{font-size:15px; font-weight:800; min-width:5.2em}
.lvbtn .lvdesc{font-size:10.5px; color:var(--tx2); line-height:1.45}
.lvbtn.main{border-color:var(--energy); background:#12312a}
.lvbtn.dis{opacity:.38}
.lvbtn .best{color:var(--vp); font-weight:700}
.modetabs{display:flex; gap:6px; margin:10px 0 2px}
.modetab{flex:1; min-height:44px; border-radius:11px; font-size:12.5px; font-weight:700;
  background:var(--panel2); border:1px solid var(--line); color:var(--tx2)}
.modetab.on{background:#12312a; border-color:var(--energy); color:var(--tx)}
#tutbub{position:absolute; left:8px; right:8px; bottom:158px; z-index:55;
  background:linear-gradient(160deg,#1c3a31,#132921); border:1px solid var(--energy); border-radius:13px;
  padding:10px 12px; font-size:12.5px; line-height:1.6; box-shadow:0 10px 30px #000c}
#tutbub.attop{bottom:auto; top:64px}
#tutbub.mini{left:8px; right:auto; bottom:158px; top:auto; padding:0; background:none; border:none; box-shadow:none}
#tutbub.mini .minichip{min-height:44px; display:flex; align-items:center; gap:6px; padding:0 14px;
  background:linear-gradient(160deg,#1c3a31,#132921); border:1px solid var(--energy); border-radius:99px;
  font-size:12px; font-weight:700; box-shadow:0 6px 20px #000a}
#tutbub .tstep{font-size:9px; color:var(--energy); letter-spacing:.08em; margin-bottom:2px}
#tutbub .tacts{display:flex; gap:8px; margin-top:8px; justify-content:flex-end}
#tutbub .tbtn2{min-height:40px; padding:0 16px; border-radius:10px; font-size:12px; font-weight:700;
  background:linear-gradient(135deg,#3fc4a0,#2b9b7d); color:#06231c}
#tutbub .tbtn2.sub{background:var(--panel2); color:var(--tx2); border:1px solid var(--line)}

/* 防いだバナー */
#banner{opacity:0; position:absolute; top:8px; left:50%; transform:translateX(-50%) translateY(-140%); z-index:70;
  background:#173327f0; border:1px solid var(--ok); color:#d9ffe8; border-radius:12px; padding:9px 16px;
  font-size:12px; white-space:nowrap; transition:transform .25s; pointer-events:none; max-width:92%}
#banner.on{transform:translateX(-50%) translateY(0); opacity:1}

/* トースト・パーティクル */
.toast{position:fixed; z-index:130; pointer-events:none; background:#3b1d24; border:1px solid #f8717166;
  color:#ffd7d7; font-size:11px; padding:4px 10px; border-radius:8px; transform:translate(-50%,-120%);
  white-space:nowrap; animation:tfade 1.7s forwards}
@keyframes tfade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0; margin-top:-12px}}
.particle{position:fixed; z-index:130; pointer-events:none; font-size:16px;
  transition:transform .7s cubic-bezier(.2,.7,.3,1), opacity .7s; will-change:transform}
.shake{animation:shake .3s 2}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.statflash{animation:sflash .6s}
@keyframes sflash{35%{background:#3fc4a044; border-color:var(--energy)}}
.hpflash{animation:hflash .6s 2}
@keyframes hflash{35%{background:#f8717155; border-color:var(--ng)}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tstat" id="stat-turn"><b>1</b><span>ターン</span></div>
    <div class="tstat" id="stat-hp"><b style="color:#f87171">20</b><span>体力</span><div class="hpbar"><i></i></div></div>
    <div class="tstat" id="stat-energy"><b style="color:#3fc4a0">0</b><span>エネルギー</span></div>
    <div class="tstat" id="stat-vp"><b style="color:#f2d13c">0</b><span>スコア</span></div>
    <div id="condchip" hidden></div>
    <button id="rulebtn" class="tbtn">？</button>
    <button id="menubtn" class="tbtn">☰</button>
  </div>
  <div id="bodyarea">
    <div id="bodywrap">
      <svg id="bodysvg" viewBox="0 0 300 500" preserveAspectRatio="xMidYMid meet">
        <circle class="sil" cx="150" cy="42" r="30"/>
        <path class="sil" d="M150 72 C 192 78 206 96 208 130 L208 252 C208 292 190 306 150 309 C110 306 92 292 92 252 L92 130 C94 96 108 78 150 72 Z"/>
        <rect class="sil" x="56" y="104" width="26" height="152" rx="13"/>
        <rect class="sil" x="218" y="104" width="26" height="152" rx="13"/>
        <rect class="sil" x="103" y="300" width="36" height="176" rx="18"/>
        <rect class="sil" x="161" y="300" width="36" height="176" rx="18"/>
        <path class="vessel" d="M132 128 C 150 150 152 190 150 230 C 148 268 150 300 150 330"/>
        <path class="vessel" d="M132 122 C 150 118 175 112 190 116"/>
      </svg>
      <div class="flowchip">🩸 <b id="flowbig">0</b><span id="flowdelta"></span></div>
      <div class="miniz blood" id="zone-blood"></div>
      <div class="miniz gut" id="zone-gut"></div>
      <div class="miniz waste" id="zone-waste"></div>
      <div id="nodes"></div>
    </div>
    <div id="banner"></div>
  </div>
  <div id="guidebar"></div>
  <div id="handrow"></div>
  <div id="actrow">
    <button class="abtn" id="shopbtn">🛒 臓器を買う</button>
    <button class="abtn grow dim" id="grow">🌱 成長</button>
    <button class="abtn end" id="endturn">ターン終了 ▶</button>
  </div>

  <div id="sheet">
    <header><h2>手に入れる</h2><span class="en" id="sheeten"></span><button class="close" id="sheetclose">とじる</button></header>
    <div id="shoplist"></div>
  </div>

  <div class="ovl" id="ovl"><div class="box" id="ovlbox"></div></div>
</div>
<script>
/* ============================================================
   臓器アドベンチャー ― カラダ経営デッキ
   中2理科 第二分野「動物の体のつくりとはたらき」
   ------------------------------------------------------------
   ・臓器カード … 手に入れると「体（場）」に残り、毎ターン1回使える
   ・生活カード … 山札→手札で引く。毎ターン2枚までプレイできる
   ============================================================ */

const CFG = { maxTurn:18, goalVP:16, startHP:20, startGlucose:6, handSize:4, playLimit:2, buysPerTurn:2, vpCost:3,
  eventFrom:5, eventRate:0.4,
  /* ↓「むずかしい」でだけ有効になるルール */
  hard:false, o2base:3, o2perRBC:3 };

/* 【むずかしい】1ターンに全身へ届けられる酸素の量。ヘモグロビン＝赤血球の数で決まる */
function o2limit(G){ return CFG.o2base + G.board.filter(o=>o.id==='sekkekkyu').length*CFG.o2perRBC; }
function o2check(G,need){
  if(!CFG.hard) return null;
  const lim=o2limit(G);
  if(G.o2used+need>lim) return F(`赤血球が全身へ運べる酸素をこえている（このターン ${G.o2used}/${lim}）。赤血球をふやそう`);
  return null;
}

/* 消化管の中の物質。栄養素ごとに分解の順番で並べてある */
const GUTNAMES = {
  starch:'でんぷん', maltose:'ばくが糖', glucose:'ブドウ糖',
  protein:'タンパク質', peptone:'ペプトン', peptide:'ペプチド', amino:'アミノ酸',
  fat:'脂肪', emul:'乳化した脂肪', fatty:'脂肪酸＋モノグリセリド'
};
const BLOODNAMES = { glucose:'ブドウ糖', amino:'アミノ酸', fat:'脂肪', oxygen:'酸素' };
const WASTENAMES = { co2:'二酸化炭素', ammonia:'アンモニア', urea:'尿素' };

/* 処理枠を複数の物質に均等配分する（1種類が枠を独占しないように） */
function spread(pool, keys, cap){
  const amt={}; keys.forEach(k=>amt[k]=0);
  let left=cap, moved=true;
  while(left>0 && moved){
    moved=false;
    for(const k of keys){
      if(left<=0) break;
      if(pool[k]-amt[k] > 0){ amt[k]++; left--; moved=true; }
    }
  }
  return amt;
}

const T = m => ({ok:true, msg:m});
const F = m => ({ok:false, msg:m});

/* ============================================================
   カードデータベース
   kind:'organ' … 体に残る／kind:'life' … 山札に入る生活カード
   ============================================================ */
const DB = {

/* ---------- 循環 ---------- */
shinzou:{kind:'organ', name:'心臓', ico:'❤️', cat:'循環', cost:5,
  text:'血流+3',
  sci:'ヒトの心臓は2心房2心室。全身→右心房→右心室→肺（肺循環）、肺→左心房→左心室→全身（体循環）。血液がすべての臓器をつないでいるので、心臓が動かないとどの臓器も働けない。',
  act(G){ G.flow+=3; return T('拍動：血流+3'); }},
kesshou:{kind:'organ', name:'血しょう', ico:'🟡', cat:'循環', cost:4,
  text:'血流+2、二酸化炭素-1',
  sci:'血液の液体成分。養分・二酸化炭素・不要物をとかして運ぶ。一部は毛細血管からしみ出して組織液となり、細胞とのやりとりを仲立ちする。',
  act(G){ G.flow+=2; const d=Math.min(1,G.waste.co2); G.waste.co2-=d; return T('血しょうが物質を運んだ：血流+2'); }},
sekkekkyu:{kind:'organ', name:'赤血球（ヘモグロビン）', ico:'🔴', cat:'循環', cost:4,
  text:'酸素+3／【むずかしい】1ターンに全身へ運べる酸素+3',
  sci:'赤血球にふくまれるヘモグロビンは、酸素の多いところで酸素と結びつき、酸素の少ないところで酸素をはなす。この性質のおかげで全身に酸素を届けられる。逆にいえば、肺でどれだけ酸素をとりこんでも、赤血球が少なければ全身へ運べる量には限りがある（赤血球やヘモグロビンが不足した状態を貧血という）。',
  act(G){ G.blood.oxygen+=3; return T('ヘモグロビンが酸素を運んだ：酸素+3'); }},
hakkekkyu:{kind:'organ', name:'白血球', ico:'⚪', cat:'循環', cost:4,
  text:'体にあるだけで「かぜ」を無効化（使うと体力+1）',
  sci:'体内に入った細菌などの病原体をとらえて分解する（食作用）。',
  act(G){ if(G.hp>=CFG.startHP) return F('体力は満タン'); G.hp++; return T('白血球が病原体をとらえた：体力+1'); }},
kesshouban:{kind:'organ', name:'血小板', ico:'🩹', cat:'循環', cost:4,
  text:'体にあるだけで「けが」を無効化（使うと体力+1）',
  sci:'出血したときに血液を固めて出血を止める（止血）。',
  act(G){ if(G.hp>=CFG.startHP) return F('体力は満タン'); G.hp++; return T('血小板が止血した：体力+1'); }},

/* ---------- 呼吸 ---------- */
hai:{kind:'organ', name:'肺（肺胞）', ico:'🫁', cat:'呼吸', cost:5, flow:1,
  text:'血流1｜酸素+4、二酸化炭素-3',

  sci:'すい液は三大栄養素すべてに働く万能の消化液。アミラーゼ（でんぷん→ばくが糖）、トリプシン（タンパク質をさらに分解）、リパーゼ（脂肪→脂肪酸＋モノグリセリド）をふくむ。アミラーゼはだ液のものと同じはたらきで、でんぷんに作用する。トリプシンもアミノ酸まではしない。脂肪だけはリパーゼで最後まで分解される。',

<script>
/* ============================================================
   ゲーム進行
   ============================================================ */
let G, PREV=null;
const HOOKS={};   /* 画面側が差し込むフック（無ければ何もしない） */

function newGame(){
  G = {
    turn:1, hp:CFG.startHP, vp:0, energy:CFG.startEnergy||0, flow:0,
    plays:CFG.playLimit, buys:CFG.buysPerTurn, bouko:false, over:false, o2used:0,
    gut:{starch:0,maltose:0,glucose:0,protein:0,peptone:0,peptide:0,amino:0,fat:0,emul:0,fatty:0},
    blood:{glucose:CFG.startGlucose,amino:0,fat:0,oxygen:0},
    waste:{co2:0,ammonia:0,urea:0},
    board:(CFG.startOrgans||START_ORGANS).map(id=>({id,used:false})),
    deck:shuffle(START_DECK.slice()), hand:[], discard:[],
    log:[], learned:new Set((CFG.startOrgans||START_ORGANS)), history:[], abs:{g:0,a:0,f:0}, burned:{g:0,a:0,f:0},
  };
  PREV=null;
  draw(CFG.handSize);
  say('m','ゲーム開始。心臓 → 肺 → 食べる → 消化 → 吸収 → 細胞 の順で体を回そう。');
  say('m',`スタート時、肝臓のグリコーゲンからつくられた ブドウ糖${CFG.startGlucose} が血液中にある。`);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function draw(n){
  for(let i=0;i<n;i++){
    if(!G.deck.length){
      if(!G.discard.length) break;
      G.deck = shuffle(G.discard); G.discard = [];
      say('m','捨て札をきりなおして山札にした');
    }
    G.hand.push(G.deck.pop());
  }
}
function say(cls,msg){ G.log.unshift({cls,msg:`[${G.turn}] ${msg}`}); if(G.log.length>150) G.log.pop(); }
function has(id){ return G.board.some(o=>o.id===id); }
function countOrgan(id){ return G.board.filter(o=>o.id===id).length; }

/* ============================================================
   エフェクト（実DOMがある時だけ動く）
   ============================================================ */
function isDom(el){ return el && typeof el.getBoundingClientRect==='function'; }
function toast(el,msg){
  if(!isDom(el) || typeof document.createElement!=='function') return;
  const r=el.getBoundingClientRect();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  t.style.left=(r.left+r.width/2)+'px'; t.style.top=r.top+'px';
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}
function fx(fromEl,toEl,emoji,n){
  if(!isDom(fromEl)||!isDom(toEl)) return;
  const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const cnt=Math.min(n||1,5);
  for(let i=0;i<cnt;i++){
    const p=document.createElement('div'); p.className='particle'; p.textContent=emoji;
    p.style.left=(a.left+a.width/2-9)+'px'; p.style.top=(a.top+a.height/2-9)+'px';
    document.body.appendChild(p);
    const dx=b.left+b.width/2-(a.left+a.width/2)+(Math.random()*36-18);
    const dy=b.top+b.height/2-(a.top+a.height/2)+(Math.random()*24-12);
    setTimeout(()=>{ p.style.transform=`translate(${dx}px,${dy}px) scale(.55)`; p.style.opacity='0'; }, 40+i*110);
    setTimeout(()=>p.remove(), 1050+i*110);
  }
}
function pulse(el){ if(!isDom(el)) return; el.classList.add('pulse'); setTimeout(()=>el.classList&&el.classList.remove('pulse'),600); }
function flashStat(id){
  if(typeof document.querySelector!=='function') return;
  const el=document.getElementById(id);
  if(el&&el.classList){ el.classList.add('statflash'); setTimeout(()=>el.classList.remove('statflash'),700); }
}
const FX_TGT={食事:'zone-gut', 生活:'zone-blood', 消化:'zone-gut', 吸収:'zone-blood',
  呼吸:'zone-blood', 循環:'zone-blood', 細胞呼吸:'stat-energy', 排出:'zone-waste'};
const FX_ICO={消化:'✨', 吸収:'🟠', 呼吸:'🫧', 循環:'🩸', 細胞呼吸:'⚡', 排出:'💧'};
function fxFor(cat,srcEl,ico,n){
  const tgt=document.getElementById(FX_TGT[cat]||'zone-blood');
  fx(srcEl,tgt,FX_ICO[cat]||ico,n||3);
  if(cat==='細胞呼吸'){ fx(srcEl,document.getElementById('zone-waste'),'💨',2); flashStat('stat-energy'); }
}

/* ============================================================
   操作
   ============================================================ */
function useOrgan(i,el){
  if(G.over) return;
  const o=G.board[i], c=DB[o.id];
  if(o.used){ toast(el,'このターンはもう使った'); return; }
  const r=c.act(G);
  if(!r.ok){ say('r',`${c.name}：${r.msg}`); toast(el,r.msg); render(); return; }
  o.used=true; G.learned.add(o.id);
  say('g',`${c.ico} ${c.name} → ${r.msg}`);
  pulse(el); fxFor(c.cat,el,c.ico,3);
  tutEvent('organ',o.id);
  render();
}
function useOrganById(id,el){
  if(G.over) return;
  if(!has(id)){ showCard(id,true); return; }
  const i=G.board.findIndex(o=>o.id===id&&!o.used);
  if(i<0){ toast(el,'このターンはもう使った'); return; }
  useOrgan(i,el);
}
function playCard(idx,el){
  if(G.over) return;
  if(G.plays<=0){ toast(el,`生活カードは1ターン${CFG.playLimit}枚まで`); return; }
  const id=G.hand[idx], c=DB[id];
  const r=c.act(G);
  if(!r.ok){ say('r',`${c.name}：${r.msg}`); toast(el,r.msg); render(); return; }
  G.hand.splice(idx,1); G.discard.push(id); G.plays--; G.learned.add(id);
  say('g',`${c.ico} ${c.name} → ${r.msg}`);
  pulse(el); fxFor(c.cat,el,c.ico,3);
  tutEvent('life',id);
  if(G.vp>=CFG.goalVP) return finish(true);
  render();
}
function buy(id,el){
  if(G.over) return;
  const c=DB[id];
  if(G.buys<=0){ toast(el,`1ターンに手に入れられるのは${CFG.buysPerTurn}枚まで`); return; }
  if(G.energy<c.cost){ toast(el,`エネルギーが足りない（${c.cost}必要）`); return; }
  G.energy-=c.cost; G.buys--;
  if(c.kind==='organ'){
    G.board.push({id,used:false});
    say('y',`${c.ico} ${c.name} が体に加わった（今すぐ使える）`);
    fx(el,document.getElementById('bodywrap'),c.ico,1);
  } else {
    G.discard.push(id);
    say('y',`${c.ico} ${c.name} を山札に加えた`);
    fx(el,document.getElementById('deckbar'),c.ico,1);
  }
  tutEvent('buy',id);
  render();
}
function grow(el){
  if(G.over) return;
  if(G.energy<CFG.vpCost){ toast(el,`エネルギーが足りない（${CFG.vpCost}必要）`); return; }
  G.energy-=CFG.vpCost; G.vp++;
  say('y',`体が成長した：成長ポイント ${G.vp}／${CFG.goalVP}`);
  fx(document.getElementById('stat-energy'),document.getElementById('stat-vp'),'🌱',3);
  flashStat('stat-vp');
  tutEvent('grow');
  if(G.vp>=CFG.goalVP) return finish(true);
  render();
}
function endTurn(){
  if(G.over) return;
  if(HOOKS.beforeDamage) HOOKS.beforeDamage(G);
  if(G.over) return;
  let dmg=0, why=[];
  if(G.waste.co2>3){ const d=G.waste.co2-3; dmg+=d; why.push(`二酸化炭素がたまりすぎ（-${d}）肺で出そう`); }
  if(G.waste.ammonia>0){ const d=G.waste.ammonia*2; dmg+=d; why.push(`アンモニアは有害！（-${d}）肝臓で尿素に変えよう`); }
  if(G.waste.urea>5){
    if(G.bouko) say('m','ぼうこうが尿をためた：尿素のダメージなし');
    else { const d=G.waste.urea-5; dmg+=d; why.push(`尿素がたまりすぎ（-${d}）じん臓でこしとろう`); }
  }
  if(dmg){
    G.hp-=dmg; say('r','体調が悪化：'+why.join('／'));
    if(HOOKS.damage) HOOKS.damage(dmg,why);
    const app=document.getElementById('app');
    if(app&&app.classList){ app.classList.add('shake'); setTimeout(()=>app.classList.remove('shake'),700); }
  }
  G.history.push({t:G.turn, e:G.energy, vp:G.vp, hp:G.hp});
  G.discard.push(...G.hand); G.hand=[];

  if(G.hp<=0) return finish(false,'体力が0になった。不要物の処理が追いつかなかった。');
  if(G.turn>=CFG.maxTurn) return finish(false,`${CFG.maxTurn}ターンで成長ポイントが目標に届かなかった（${G.vp}／${CFG.goalVP}）`);

  G.turn++; G.flow=0; G.plays=CFG.playLimit; G.buys=CFG.buysPerTurn; G.bouko=false; G.o2used=0; G.abs={g:0,a:0,f:0}; G.burned={g:0,a:0,f:0};
  G.board.forEach(o=>o.used=false);
  draw(CFG.handSize);

  if(G.turn>=CFG.eventFrom && Math.random()<CFG.eventRate){
    const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    if(ev.guard && has(ev.guard)){ say('g',`${ev.ico} ${ev.name}：${ev.guardMsg}`); if(HOOKS.guard) HOOKS.guard(ev); }
    else {
      if(ev.effect) ev.effect(G,CFG.hard);
      const d = CFG.hard ? (ev.hardDmg||ev.dmg) : ev.dmg;
      if(d){ G.hp-=d; say('r',`${ev.ico} ${ev.name}：${ev.msg}（体力-${d}）`); }
      else say('r',`${ev.ico} ${ev.name}：${ev.msg}`);
      if(HOOKS.event) HOOKS.event(ev, d||0);
      if(G.hp<=0) return finish(false,'体力が0になった。病気やけがへの備えが足りなかった。');
    }
  }
  tutEvent('end');
  render();
}
function finish(win,reason){ G.over=true; render(); showResult(win,reason); }

/* 数値の増減フロート（PC/スマホ共通） */
function delta(cur,key,invert){
  if(!PREV) return '';
  const old=key.split('.').reduce((o,k)=>o&&o[k],PREV);
  if(old===undefined||old===cur) return '';
  const d=cur-old;
  const good = invert ? d<0 : d>0;
  return `<span class="delta ${good?'up':'dn'}">${d>0?'+':''}${d}</span>`;
}

function removeTutBub(){

}
function tutNext(){ if(!TUT) return; TUT.i++; TUT.min=false; if(typeof document.querySelector==='function'){ render(); tutShow(); } }
function tutMin(v){ if(!TUT) return; TUT.min=v; tutShow(); }
function tutShow(){
  if(typeof document.createElement!=='function') return;
  if(!TUT||TUT.i>=TUTSTEPS.length){ removeTutBub(); return; }
  const st=TUTSTEPS[TUT.i];
  let b=document.getElementById('tutbub');
  if(!b){ b=document.createElement('div'); b.id='tutbub'; document.getElementById('app').appendChild(b); }
  if(TUT.min){
    b.className='mini';

  b.innerHTML=`<div class="tstep">チュートリアル ${TUT.i+1} / ${TUTSTEPS.length}</div>
    <div>${st.t}</div>

function tutEvent(kind,id){
  if(TUT){
    const st=TUTSTEPS[TUT.i];
    if(!st||!st.wait) return;
    const [k,v]=st.wait;
    if(k!==kind) return;
    if(v==='food'){ if(!DB[id]||DB[id].cat!=='食事') return; }
    else if(v && v!==id) return;
    TUT.i++; TUT.min=false;
    if(typeof document.querySelector==='function'){ tutShow(); guideApply(); }
    return;
  }
  if(!GUIDE||!GUIDE.on) return;
  const st=GSTEPS[GUIDE.i];
  if(!st||!st.wait) return;
  const [k,v]=st.wait;
  if(k!==kind) return;
  if(v==='food'){ if(!DB[id]||DB[id].cat!=='食事') return; }
  else if(v && v!==id) return;
  GUIDE.i++;
  if(GUIDE.i>=GSTEPS.length || (st.last)) GUIDE.on=false;
  if(typeof document.querySelector==='function') render();
}
function guideApply(){
  if(typeof document.querySelectorAll!=='function') return;
  document.querySelectorAll('.guide').forEach(e=>e.classList.remove('guide'));
  if(TUT){
    const gb0=$id('guidebar'); if(gb0) gb0.innerHTML='';
    const st=TUTSTEPS[TUT.i];
    if(st&&st.sel){ const el=document.querySelector(st.sel); if(el) el.classList.add('guide'); }
    return;
  }
  const gb=$id('guidebar');
  if(!GUIDE||!GUIDE.on||G.over){ if(gb) gb.innerHTML=warnHint(); return; }
  const st=GSTEPS[GUIDE.i];
  if(!st){ gb.innerHTML=warnHint(); return; }
  gb.innerHTML=st.t;
  if(st.sel){ const el=document.querySelector(st.sel); if(el) el.classList.add('guide'); }
}
function warnHint(){
  if(!G) return '';
  if(CFG.hard && G.o2used>=o2limit(G) && G.board.some(o=>!o.used&&DB[o.id].cat==='細胞呼吸'))
    return `⚠️ 運べる酸素を使いきった（${G.o2used}/${o2limit(G)}）。🔴赤血球で+${CFG.o2perRBC}できる`;
  if(CFG.hard && G.turn>=CFG.eventFrom && !has('hakkekkyu') && !has('kesshouban'))
    return '⚠️ かぜ・けがは体力-6！ ⚪白血球・🩹血小板で無効化できる（🛒）';
  if(G.waste.ammonia>0) return '⚠️ アンモニアは有害！ 🟤肝臓で尿素に変えよう'+(has('kanzou')?'':'（🛒で買える）');
  if(G.waste.co2>3) return '⚠️ 二酸化炭素がたまっている。🫁肺で出そう';
  if(G.waste.urea>5) return '⚠️ 尿素がたまっている。🫘じん臓でこしとろう';
  if(G.gut.protein>0 && !has('i')) return '💡 タンパク質は🫙胃がないと分解できない（🛒で買える）';
  if(G.gut.fat>1 && !has('tannou')) return '💡 脂肪は🟢たんのう＋🥖すい臓で分解できる';
  if(G.energy>=CFG.vpCost) return `🌱 エネルギー${G.energy}！「成長」でスコアにできる`;
  return '';
}

HOOKS.beforeDamage = ()=>{
  if(COND&&COND.each&&!G.over) COND.each();
  /* バランスボーナス：かんたん・ふつう＝吸収した種類／むずかしい＝細胞呼吸で使った種類 */
  if(CFG.comboBonus){
    const src = CFG.hard ? G.burned : G.abs;
    if(src){
      const t=(src.g>0)+(src.a>0)+(src.f>0);
      if(t>=2){
        const bonus=t===3?3:1;
        G.vp+=bonus;
        const label = CFG.hard ? `🔥 ${t}種類の栄養素で細胞呼吸` : `🍱 ${t}種類の栄養素を吸収`;
        say('y',`${label} → ★+${bonus}`);
        banner(`${label} → ★+${bonus}`);
        vib(50);
        if(G.vp>=CFG.goalVP){ finish(true); return; }
      }
    }
  }
};

    <tr><td style="text-align:left;padding:3px">胆汁</td><td>―</td><td>―</td><td>乳化(酵素なし)</td></tr>
    <tr><td style="text-align:left;padding:3px">すい液</td><td>アミラーゼ</td><td>トリプシン</td><td>リパーゼ</td></tr>
    <tr><td style="text-align:left;padding:3px">腸のかべ</td><td>マルターゼ</td><td>ペプチダーゼ</td><td>―</td></tr>
  </table></div>
  <p style="color:#9aa0b8;font-size:10px;margin-top:2px">※すい液だけが三大栄養素すべてに働く「万能の消化液」</p>

  <p style="margin-top:8px"><b>テストに出るポイント</b></p>
  <p style="font-size:11px">・胆汁は消化酵素を<b>ふくまない</b>／・アミラーゼの仕事は<b>ばくが糖まで</b>（ブドウ糖にするのはマルターゼ）／・脂肪の吸収先だけ<b>リンパ管</b>／・消化管の中は<b>体の外</b>／・柔毛は<b>表面積</b>を大きくして吸収の効率を上げる</p>

  <button class="btn" onclick="showRules()">← ルールにもどる</button>
  <button class="btn sub" onclick="closeOvl()">ゲームにもどる</button>`);
}

/* ---------- メニュー（設定） ---------- */
function showMenu(){
  if(!G) return;
  const note = LEVEL.key==='easy'
    ? '※かんたんは途中セーブがないので、ホームにもどると最初からになります'
    : '※ここまでの進行は自動セーブずみ。ホームにもどっても「つづきから」で再開できます';
  ovl(`<h2>メニュー</h2>
    <p class="c" style="color:#9aa0b8;font-size:11px">${LEVEL.name}・${MODE==='clear'?`クリア（目標★${CFG.goalVP}）`:'スコアアタック'}・${G.turn}ターン目</p>
    <button class="btn" onclick="closeOvl()">▶ つづける</button>
    <button class="btn sub" onclick="showRules()">？ ルールをみる</button>
    <button class="btn sub" onclick="closeOvl();startGame(LEVEL.key)">🔁 さいしょからやり直す</button>
    <button class="btn sub" onclick="closeOvl();showLevelSelect()">🏠 ホームへもどる</button>
    <p class="c" style="color:#6d7390;font-size:10px;margin-top:8px">${note}</p>`);
}

/* ---------- ショップ（ボトムシート） ---------- */
function openSheet(){ renderSheet(); $id('sheet').classList.add('on'); tutEvent('buy','open'); }
function closeSheet(){ const s=$id('sheet'); if(s) s.classList.remove('on'); tutEvent('sheetclose'); }
function renderSheet(){
  const card=id=>{
    const c=DB[id], can=G.energy>=c.cost&&G.buys>0;
    const owned=c.kind==='organ'?G.board.filter(o=>o.id===id).length:0;
    return `<button class="scard ${can?'':'cant'}" onclick="buy('${id}',this);renderSheet();">
      <div class="cost">${c.cost}</div>
      <div class="nm">${c.ico} ${c.name}${owned?` <span style="color:var(--energy)">×${owned}</span>`:''} <span class="cat">${c.cat}</span></div>
      <div class="tx">${c.text}</div></button>`;
  };
  $id('shoplist').innerHTML =
    `<div class="shophead">臓器（体に残り、毎ターン使える）</div>`+ORGAN_SHOP.map(card).join('')+
    `<div class="shophead">生活カード（山札に加わる）</div>`+LIFE_SHOP.map(card).join('');
  $id('sheeten').textContent=`⚡${G.energy}　このターンあと${G.buys}枚`;
}

/* ---------- 描画 ---------- */
const SP_LAB={cellG:'細胞(糖)',cellA:'細胞(ﾀﾝﾊﾟｸ)',cellF:'細胞(脂肪)',oukakumaku:'横隔膜',
  sekkekkyu:'赤血球',hakkekkyu:'白血球',kesshouban:'血小板',kesshou:'血しょう',tannou:'たんのう'};
const SP_POS={
  daeki:[50,8], hai:[61,23], shinzou:[40,25], oukakumaku:[52,33],
  kanzou:[36,40], tannou:[44,47], i:[63,40], suizou:[57,48],
  shouchou:[50,57], daichou:[50,65], jinzou:[70,54], bouko:[50,72],
  cellG:[33,86], cellA:[60,88], cellF:[46,94],
  kesshou:[12,58], sekkekkyu:[12,68], hakkekkyu:[12,78], kesshouban:[12,88],
};
function render(){
  if(typeof document.querySelector!=='function' || !G) return;
  const set=(id,html)=>{ const e=$id(id); if(e) e.innerHTML=html; };

  set('stat-turn',`<b>${G.turn}<span style="font-size:10px;color:#9aa0b8">/${CFG.maxTurn}</span></b><span>ターン</span>`);
  set('stat-hp',`<b style="color:#f87171">${Math.max(0,G.hp)}${delta(G.hp,'hp')}</b><span>体力</span><div class="hpbar"><i style="width:${Math.max(0,G.hp/CFG.startHP*100)}%"></i></div>`);
  set('stat-energy',`<b style="color:#3fc4a0">${G.energy}${delta(G.energy,'energy')}</b><span>エネルギー</span>`);
  if(MODE==='clear'){
    set('stat-vp',`<b style="color:#f2d13c">★${G.vp}<span style="font-size:10px;color:#9aa0b8">/${CFG.goalVP}</span>${delta(G.vp,'vp')}</b><span>もくひょう</span>`);
  } else {
    const best=load(bestKey());
    set('stat-vp',`<b style="color:#f2d13c">★${G.vp}${delta(G.vp,'vp')}</b><span>${best!=null?`ベスト★${best}`:'スコア'}</span>`);
  }
  const cc=$id('condchip'); if(cc&&COND){ cc.hidden=false; cc.textContent=`${COND.ico} ${COND.name}`; }

  $id('flowbig').textContent=G.flow;
  set('flowdelta',delta(G.flow,'flow'));
  const bw=$id('bodywrap'); if(bw&&bw.classList){ G.flow>0?bw.classList.add('flowing'):bw.classList.remove('flowing'); }

  /* 体の上のミニ数値 */
  const mrow=(nm,v,key,inv,warn)=>`<div class="mrow ${warn?'warn':''}"><span>${nm}</span><b>${v}${delta(v,key,inv)}</b></div>`;
  let gh='<h4>消化管（体の外）</h4>';
  const gutKeys=Object.keys(GUTNAMES).filter(k=>G.gut[k]>0);
  gutKeys.slice(0,5).forEach(k=>{ gh+=mrow(GUTNAMES[k].split('（')[0],G.gut[k],'gut.'+k); });
  if(gutKeys.length>5){ const rest=gutKeys.slice(5).reduce((n,k)=>n+G.gut[k],0); gh+=`<div class="mrow" style="color:#9aa0b8"><span>ほか${gutKeys.length-5}種</span><b>${rest}</b></div>`; }
  if(!gutKeys.length) gh+='<div class="mrow" style="color:#6d7390">からっぽ</div>';
  set('zone-gut',gh);
  let bh='<h4>血液</h4>';
  for(const k in BLOODNAMES) bh+=mrow(BLOODNAMES[k],G.blood[k],'blood.'+k);
  if(CFG.hard) bh+=`<div class="mrow ${G.o2used>=o2limit(G)?'warn':''}"><span>運べた酸素</span><b>${G.o2used}/${o2limit(G)}</b></div>`;
  set('zone-blood',bh);
  let wh='<h4>不要物</h4>';
  wh+=mrow('二酸化炭素',G.waste.co2,'waste.co2',true,G.waste.co2>3);
  wh+=mrow('アンモニア',G.waste.ammonia,'waste.ammonia',true,G.waste.ammonia>0);
  wh+=mrow('尿素',G.waste.urea,'waste.urea',true,G.waste.urea>5);
  set('zone-waste',wh);

  /* 臓器ノード */
  set('nodes',Object.keys(SP_POS).map(id=>{
    const c=DB[id],[x,y]=SP_POS[id];
    const owned=G.board.filter(o=>o.id===id).length;
    const unused=G.board.filter(o=>o.id===id&&!o.used).length;
    const cls=owned?(unused?'':'spent'):'ghost';
    return `<button class="onode ${cls}" id="node-${id}" style="left:${x}%;top:${y}%"
      onclick="${owned?`useOrganById('${id}',this)`:`showCard('${id}',true)`}">
      ${owned>1?`<span class="ocnt">${unused}/${owned}</span>`:''}
      <span class="oico">${c.ico}</span><span class="olab">${SP_LAB[id]||c.name.split('（')[0]}</span></button>`;
  }).join(''));

  /* 手札 */
  set('handrow',G.hand.map((id,i)=>{
    const c=DB[id];
    return `<button class="hcard" onclick="playCard(${i},this)">
      <span class="ico">${c.ico}</span><div class="nm">${c.name}</div><div class="tx">${c.text}</div></button>`;
  }).join('')||'<div style="color:#6d7390;font-size:11px;padding:12px">手札なし。ターン終了しよう</div>');

  const gb=$id('grow');
  if(gb){ gb.classList.toggle('dim',G.energy<CFG.vpCost); gb.innerHTML=`🌱 成長 <span style="font-size:10px">(⚡${CFG.vpCost}→★1)</span>`; }

  if($id('sheet') && $id('sheet').classList && $id('sheet').classList.contains && $id('sheet').classList.contains('on')) renderSheet();

  PREV=JSON.parse(JSON.stringify({gut:G.gut,blood:G.blood,waste:G.waste,energy:G.energy,vp:G.vp,hp:G.hp,flow:G.flow}));
  guideApply();
  if(TUT) tutShow();
  if(!TUT) spSave();
}

/* ---------- ルール説明 ---------- */
function showRules(){
  const zukan = [...ORGAN_SHOP, ...LIFE_SHOP].map(id=>
    `<button style="width:52px;min-height:48px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px 1px" onclick="showCard('${id}',false,true)">
      <span style="font-size:16px;display:block">${DB[id].ico}</span><span style="font-size:7.5px;color:var(--tx2)">${(SP_LAB[id]||DB[id].name.split('（')[0]).slice(0,5)}</span></button>`).join('');
  ovl(`<h2>ルール</h2>
    <p><b>目的：</b>${CFG.maxTurn}ターンで、食べ物をエネルギーに変えて「🌱成長」し、スコア★をかせぐ。体力0でゲームオーバー。</p>
    <p><b>1ターンにできること：</b>体の臓器をそれぞれ1回ずつタップ／下のカードを${CFG.playLimit}枚まで／🛒で${CFG.buysPerTurn}枚まで買う → ターン終了。</p>
    <p><b>🩸血流：</b>❤️心臓がつくる。肺・小腸・細胞・肝臓・じん臓は、使うたびに血流1が必要。</p>
    <p><b>買った臓器はずっと体に残り</b>、毎ターン使える。</p>
    <div class="chainrow"><b>糖</b>：🍚ごはん→💧だ液せん→🧻小腸→⚡細胞</div>
    <div class="chainrow"><b>タンパク質</b>：🍖肉→🫙胃→🥖すい臓→🧻小腸で吸収</div>
    <div class="chainrow"><b>脂肪</b>：🍤あげ物→🟢たんのう→🥖すい臓→🧻小腸で吸収</div>
    <div class="chainrow">${CFG.hard?'🔥 1ターンに<b>2種類</b>の栄養素で細胞呼吸すると★+1、<b>3種類</b>で★+3':'🍱 1ターンに<b>2種類</b>の栄養素を吸収で★+1、<b>3種類</b>で★+3'}</div>
    <div class="chainrow">💀 体力0でたおれると<b>スコアが半分</b>になる</div>
    <p><b>⚠️不要物：</b>二酸化炭素4以上・アンモニア1以上・尿素6以上で、ターン終了時に体力が減る。肺・肝臓・じん臓で処理しよう。</p>
    ${CFG.hard?`<p style="color:#ffb4b4"><b>🔴むずかしい追加ルール：</b>1ターンに細胞へ届けられる酸素は「${CFG.o2base}＋赤血球の数×${CFG.o2perRBC}」まで。かぜ・けがは体力-6（⚪白血球・🩹血小板が体にあれば無効）。</p>`:''}
    <p style="color:#9aa0b8;font-size:11px"><b>まちがえやすい：</b>消化管の中はまだ「体の外」。吸収されてはじめて体に入る。胆汁は消化酵素ではない。</p>
    <button class="btn sub" style="font-size:12px" onclick="showStudy()">📖 くわしく見る：三大栄養素の消化（勉強用）</button>
    <p style="margin-top:8px"><b>ずかん</b>（タップで説明）</p>
    <div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center">${zukan}</div>
    <button class="btn" onclick="closeOvl()">ゲームにもどる</button>`);
}

/* ---------- 起動 ---------- */
function startApp(){
  $id('shopbtn').onclick=openSheet;
  $id('rulebtn').onclick=showRules;
  $id('menubtn').onclick=showMenu;
  $id('sheetclose').onclick=closeSheet;
  $id('grow').onclick=function(){ grow(this); };
  $id('endturn').onclick=endTurn;
  showLevelSelect();
}
startApp();
</script>
</body>
</html>
